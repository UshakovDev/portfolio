<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Схема резервного копирования и разгрузки базы данных">
  <defs>
    <radialGradient id="bdGlow" cx="70%" cy="16%" r="80%">
      <stop offset="0%" stop-color="#2a2140"/>
      <stop offset="55%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#131424"/>
    </radialGradient>
    <marker id="bdArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#F13024"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="url(#bdGlow)"/>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="84" y="104" fill="#ffffff" fill-opacity="0.92" font-size="42" font-weight="700">Резервные копии и разгрузка базы</text>
    <text x="84" y="146" fill="#ffffff" fill-opacity="0.5" font-size="21">агенты на cron, чистка статистики, копии сайта в облако</text>

    <!-- агенты на cron -->
    <rect x="84" y="330" width="250" height="150" rx="18" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="146" cy="392" r="26" fill="none" stroke="#F13024" stroke-opacity="0.8" stroke-width="3"/>
    <path d="M146 374 L146 392 L159 400" fill="none" stroke="#F13024" stroke-opacity="0.8" stroke-width="3" stroke-linecap="round"/>
    <text x="186" y="386" fill="#ffffff" fill-opacity="0.82" font-size="23">Агенты</text>
    <text x="186" y="412" fill="#F13024" fill-opacity="0.9" font-size="19" font-weight="600">cron</text>
    <text x="108" y="456" fill="#ffffff" fill-opacity="0.4" font-size="17">выполняются по расписанию</text>

    <line x1="350" y1="405" x2="438" y2="405" stroke="#F13024" stroke-width="3" stroke-linecap="round" marker-end="url(#bdArrow)"/>

    <!-- база данных -->
    <g>
      <ellipse cx="620" cy="268" rx="148" ry="38" fill="#ffffff" fill-opacity="0.09" stroke="#ffffff" stroke-opacity="0.16"/>
      <path d="M472 268 L472 542 A148 38 0 0 0 768 542 L768 268" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.14"/>

      <!-- рабочие данные -->
      <path d="M472 452 A148 38 0 0 0 768 452 L768 400 A148 38 0 0 1 472 400 z" fill="#ffffff" fill-opacity="0.07"/>
      <path d="M472 528 A148 38 0 0 0 768 528 L768 476 A148 38 0 0 1 472 476 z" fill="#ffffff" fill-opacity="0.07"/>

      <!-- разросшаяся статистика: убрана -->
      <path d="M472 372 A148 38 0 0 0 768 372 L768 306 A148 38 0 0 1 472 306 z" fill="#F13024" fill-opacity="0.13" stroke="#F13024" stroke-opacity="0.4" stroke-dasharray="8 7"/>
      <text x="620" y="345" fill="#F13024" fill-opacity="0.95" font-size="19" font-weight="600" text-anchor="middle">статистика за годы</text>

      <text x="620" y="600" fill="#ffffff" fill-opacity="0.45" font-size="19" text-anchor="middle">удалена порциями, без остановки сайта</text>
    </g>

    <!-- облако -->
    <line x1="784" y1="330" x2="892" y2="286" stroke="#F13024" stroke-width="3" stroke-linecap="round" marker-end="url(#bdArrow)"/>
    <g opacity="0.12" fill="#ffffff">
      <circle cx="988" cy="286" r="38"/>
      <circle cx="1040" cy="264" r="52"/>
      <circle cx="1096" cy="288" r="36"/>
      <rect x="950" y="286" width="182" height="40" rx="20"/>
    </g>
    <path d="M1041 316 L1041 256 M1023 274 L1041 256 L1059 274" fill="none" stroke="#F13024" stroke-opacity="0.85" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1041" y="378" fill="#ffffff" fill-opacity="0.82" font-size="23" text-anchor="middle">Облако</text>
    <text x="1041" y="406" fill="#ffffff" fill-opacity="0.4" font-size="17" text-anchor="middle">копии по расписанию</text>
  </g>
</svg>
