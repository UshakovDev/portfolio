<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Схема миграции платформы на новую версию PHP">
  <defs>
    <radialGradient id="mgGlow" cx="70%" cy="16%" r="80%">
      <stop offset="0%" stop-color="#2a2140"/>
      <stop offset="55%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#131424"/>
    </radialGradient>
    <marker id="mgArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#F13024"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="url(#mgGlow)"/>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="84" y="104" fill="#ffffff" fill-opacity="0.92" font-size="42" font-weight="700">Миграция платформы</text>
    <text x="84" y="146" fill="#ffffff" fill-opacity="0.5" font-size="21">PHP, ядро, модули, база данных и шаблоны - одной связкой</text>

    <!-- было -->
    <text x="84" y="204" fill="#ffffff" fill-opacity="0.4" font-size="17" font-weight="600">УСТАРЕВШАЯ СВЯЗКА</text>
    <rect x="84" y="222" width="416" height="384" rx="20" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.1"/>
    <g fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.09">
      <rect x="112" y="250" width="360" height="58" rx="12"/>
      <rect x="112" y="318" width="360" height="58" rx="12"/>
      <rect x="112" y="386" width="360" height="58" rx="12"/>
      <rect x="112" y="454" width="360" height="58" rx="12"/>
      <rect x="112" y="522" width="360" height="58" rx="12"/>
    </g>
    <g fill="#ffffff" fill-opacity="0.38" font-size="23">
      <text x="136" y="287">Шаблоны</text>
      <text x="136" y="355">Внешние модули</text>
      <text x="136" y="423">Ядро 1С-Битрикс</text>
      <text x="136" y="491">База данных</text>
      <text x="136" y="559">PHP</text>
    </g>

    <!-- переход -->
    <line x1="528" y1="414" x2="616" y2="414" stroke="#F13024" stroke-width="3" stroke-linecap="round" marker-end="url(#mgArrow)"/>

    <!-- стало -->
    <text x="644" y="204" fill="#F13024" fill-opacity="0.9" font-size="17" font-weight="600">АКТУАЛЬНЫЕ ВЕРСИИ</text>
    <rect x="644" y="222" width="552" height="384" rx="20" fill="#F13024" fill-opacity="0.05" stroke="#F13024" stroke-opacity="0.3"/>
    <g fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.14">
      <rect x="672" y="250" width="496" height="58" rx="12"/>
      <rect x="672" y="386" width="496" height="58" rx="12"/>
      <rect x="672" y="454" width="496" height="58" rx="12"/>
      <rect x="672" y="522" width="496" height="58" rx="12"/>
    </g>
    <!-- строка внешних модулей выделена: ручная доработка -->
    <rect x="672" y="318" width="496" height="58" rx="12" fill="#F13024" fill-opacity="0.14" stroke="#F13024" stroke-opacity="0.45"/>

    <g fill="#ffffff" fill-opacity="0.82" font-size="23">
      <text x="696" y="287">Шаблоны</text>
      <text x="696" y="355">Внешние модули</text>
      <text x="696" y="423">Ядро 1С-Битрикс</text>
      <text x="696" y="491">База данных</text>
      <text x="696" y="559">PHP</text>
    </g>

    <g fill="#F13024" fill-opacity="0.95" font-size="17" font-weight="600">
      <text x="964" y="355">SMTP - вручную</text>
    </g>

    <g fill="#ffffff" fill-opacity="0.32" font-size="17">
      <text x="1016" y="287">правка</text>
      <text x="1016" y="423">обновление</text>
      <text x="1016" y="491">перевод</text>
      <text x="1016" y="559">подъём</text>
    </g>
  </g>
</svg>
